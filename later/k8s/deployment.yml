# Used by the AKS and GKE workflows (IMAGE_PLACEHOLDER is replaced at deploy time).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cookbook-app
  labels: { app: cookbook-app }
spec:
  replicas: 2
  selector:
    matchLabels: { app: cookbook-app }
  template:
    metadata:
      labels: { app: cookbook-app }
    spec:
      containers:
        - name: cookbook-app
          image: IMAGE_PLACEHOLDER
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: cookbook-app
spec:
  type: LoadBalancer
  selector: { app: cookbook-app }
  ports: [{ port: 80, targetPort: 8080 }]
