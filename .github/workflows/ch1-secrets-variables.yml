# Ch1 "Using secrets and variables": repository variables (vars.*), secrets (secrets.*), masking.
# Create them with scripts/Setup-Lab.ps1, or Settings > Secrets and variables > Actions.
name: 'Ch1 · Secrets and variables'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    env:
      GREETING: ${{ vars.COOKBOOK_GREETING || 'Hello (default - variable not set)' }}
      HAS_SECRET: ${{ secrets.COOKBOOK_SECRET != '' }}
    steps:
      - name: Variables are plain text
        run: |
          echo "vars.COOKBOOK_GREETING = $GREETING"
          echo "Built-in: GITHUB_REPOSITORY=$GITHUB_REPOSITORY RUNNER_OS=$RUNNER_OS"

      - name: Secrets are masked in the log
        env:
          MY_SECRET: ${{ secrets.COOKBOOK_SECRET }}
        run: |
          if [ "$HAS_SECRET" != "true" ]; then
            echo "::warning::COOKBOOK_SECRET is not set - run scripts/Setup-Lab.ps1"
            exit 0
          fi
          echo "The secret has ${#MY_SECRET} characters."
          echo "Printing it shows *** instead: $MY_SECRET"

      - name: Mask a value created at runtime
        run: |
          TOKEN="generated-$RANDOM-$RANDOM"
          echo "::add-mask::$TOKEN"
          echo "After add-mask this is hidden: $TOKEN"
