# Ch6 "Build and test your code" + "Build different versions using a matrix"
# + "Informing the user on details of your build and test results".
name: 'Ch6 · CI'

on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/ch6-ci.yml']
  pull_request:
    paths: ['src/**', '.github/workflows/ch6-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
        include:
          - os: macos-latest       # one extra combination
            node: 24
        exclude:
          - os: windows-latest     # keep the matrix small
            node: 20
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}-node${{ matrix.node }}
          path: src/test-results.xml
          retention-days: 7

  report:
    name: Test report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write        # to publish the report as a check run
    steps:
      - uses: actions/checkout@v7   # the reporter maps test files with git ls-files
      - uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: results
      - name: Publish test report
        uses: dorny/test-reporter@v3
        # PRs from forks get a read-only token and cannot write checks
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: Unit tests
          path: 'results/**/test-results.xml'
          reporter: java-junit
      - name: Summary table
        run: |
          {
            echo "### Test matrix"
            echo "| Job | Tests | Failures |"
            echo "|---|---|---|"
            for f in results/*/test-results.xml; do
              job=$(basename "$(dirname "$f")" | sed 's/^test-results-//')
              tests=$(grep -o '<testcase ' "$f" | wc -l)
              fails=$(grep -o '<failure' "$f" | wc -l)
              echo "| $job | $tests | $fails |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
